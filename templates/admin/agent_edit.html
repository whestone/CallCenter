{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}
{% block content %}
<div class="page narrow-page">
  <h1>Verwaltung</h1>
  {% include "admin/tabs.html" %}
  <form class="card" method="post" action="/admin/agents/{{ id }}">
    <h3>{{ name }}</h3>
    <label>Name<input type="text" name="name" value="{{ name }}" required></label>
    <label>E-Mail<input type="email" name="email" value="{{ email }}" required></label>
    <label>Telefon / Durchwahl<input type="tel" name="phone" value="{{ phone }}"></label>
    <label>Rolle
      <select name="role">{% for o in role_opts %}<option value="{{ o.value }}"{% if o.selected %} selected{% endif %}>{{ o.label }}</option>{% endfor %}</select>
    </label>
    <label>Kapazität (max. offene Tickets für automatische Zuweisung)<input type="number" name="capacity" min="0" max="500" value="{{ capacity }}"></label>
    <label>Telefon-Durchwahl (sipgate-Geräte-ID, z. B. e0, oder Nebenstelle)<input type="text" name="extension" value="{{ extension }}" placeholder="z. B. e0 oder 201"></label>
    <label class="check"><input type="checkbox" name="active"{% if active %} checked{% endif %}> Aktiv</label>
    <div class="checks">
      <span>Gruppen</span>
      {% for g in groups %}<label class="check"><input type="checkbox" name="group_id" value="{{ g.id }}"{% if g.checked %} checked{% endif %}> {{ g.name }}</label>{% endfor %}
    </div>
    <label>Neues Passwort<input type="password" name="password" minlength="8" placeholder="leer lassen = unverändert" autocomplete="new-password"></label>
    {% if twofa %}<label class="check"><input type="checkbox" name="reset_2fa"> Zwei-Faktor-Anmeldung zurücksetzen (z. B. Smartphone verloren)</label>{% endif %}
    <button class="btn primary wide" type="submit">Speichern</button>
  </form>
</div>
{% endblock %}
