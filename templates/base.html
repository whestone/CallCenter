<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CallCenter{% endblock %} · CallCenter</title>
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <script>try{var t=localStorage.getItem("cc-theme");if(t&&t!=="auto")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/editor.js" defer></script>
</head>
<body hx-boost="true">
<div class="shell">
  <nav class="rail" aria-label="Hauptnavigation">
    <a class="logo" href="/views" title="CallCenter">CC</a>
    <a href="/views" class="rail-link{% if nav.section == "views" %} active{% endif %}" title="Ansichten">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Tickets</span></a>
    <a href="/tickets/new?channel=phone" class="rail-link{% if nav.section == "new" %} active{% endif %}" title="Anruf erfassen">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span>Anruf</span></a>
    <a href="/chats" class="rail-link{% if nav.section == "chats" %} active{% endif %}" title="Live-Chats">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Chats</span><span class="rail-badge-slot" hx-get="/chats/badge" hx-trigger="load, every 10s" hx-swap="innerHTML"></span></a>
    <a href="/users" class="rail-link{% if nav.section == "users" %} active{% endif %}" title="Kunden">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Kunden</span></a>
    <a href="/organizations" class="rail-link{% if nav.section == "orgs" %} active{% endif %}" title="Organisationen">
      <svg viewBox="0 0 24 24"><path d="M4 21V5l8-2v18M12 9h8v12M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2"/></svg><span>Firmen</span></a>
    <a href="/kb" class="rail-link{% if nav.section == "kb" %} active{% endif %}" title="Wissensdatenbank">
      <svg viewBox="0 0 24 24"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg><span>Wissen</span></a>
    <a href="/reports" class="rail-link{% if nav.section == "reports" %} active{% endif %}" title="Reports">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Reports</span></a>
    {% if nav.is_admin %}
    <a href="/admin" class="rail-link{% if nav.section == "admin" %} active{% endif %}" title="Verwaltung">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Admin</span></a>
    {% endif %}
  </nav>
  <div class="main">
    <header class="topbar">
      <form action="/search" method="get" class="search" role="search">
        <input type="search" name="q" placeholder="Suchen … #Nr., Name, Text oder status:open" aria-label="Suche" autocomplete="off"
               hx-get="/search/quick" hx-trigger="input changed delay:250ms, focus" hx-target="#quick-search" hx-swap="innerHTML" hx-sync="this:replace">
        <div id="quick-search" class="quick-search"></div>
      </form>
      <div class="topbar-actions">
        <a class="btn" href="/tickets/new?channel=phone">📞 Anruf erfassen</a>
        <a class="btn primary" href="/tickets/new?channel=web">+ Ticket</a>
        <form method="post" action="/me/availability" class="availability" title="Dein Status für die automatische Zuweisung">
          <span class="dot dot-{{ nav.availability }}"></span>
          <select name="availability" aria-label="Status" onchange="this.form.requestSubmit()">
            {% for o in nav.availability_opts %}<option value="{{ o.value }}"{% if o.selected %} selected{% endif %}>{{ o.label }}</option>{% endfor %}
          </select>
        </form>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Design umschalten" title="Design umschalten">◐</button>
        <a class="bell" href="/notifications" title="Benachrichtigungen" hx-get="/notifications/badge" hx-trigger="load, every 30s" hx-swap="innerHTML"><span aria-hidden="true">🔔</span></a>
        <a class="avatar" href="/me" title="{{ nav.name }} – Mein Profil">{{ nav.initials }}</a>
        <form method="post" action="/logout" hx-boost="false"><button class="link">Abmelden</button></form>
      </div>
    </header>
    <main class="content">
      <div id="call-banner" hx-get="/calls/banner" hx-trigger="load, every 3s" hx-swap="innerHTML"></div>
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
