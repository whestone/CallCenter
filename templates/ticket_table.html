{% if rows.is_empty() %}
<div class="empty">Keine Tickets gefunden.</div>
{% else %}
<div class="table-wrap">
<table class="tickets ticket-list">
  <thead>
    <tr><th>Ticket</th>{% for c in cols.columns() %}<th>{{ c.1 }}</th>{% endfor %}</tr>
  </thead>
  <tbody>
  {% for r in rows %}
    <tr data-href="/tickets/{{ r.id }}">{% include "ticket_row_cells.html" %}</tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endif %}
